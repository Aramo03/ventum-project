name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ventum_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-db-password-not-a-placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ventum_db"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DEBUG: "True"
      SECRET_KEY: ci-backend-secret-key-not-used-for-deploy
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ventum_db
      DB_USER: postgres
      DB_PASSWORD: ci-db-password-not-a-placeholder
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
